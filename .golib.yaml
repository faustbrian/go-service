schema_version: 1
tool_version: v1.6.2
tool_checksums_sha256: 2a740a44fee468f042b4a66e086fc01a02d8d28877c9b1866e278102665b35ad

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: .verification

mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json

api:
  baselines:
    - module: .
      mode: apidiff
      path: api/baseline.txt

operations:
  - module: .
    gate: docs
    steps:
      - type: make
        makefile: verification/package.mk
        target: docs
        timeout: 20m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzConfig$'
        budget: 5s
        timeout: 20m
      - type: go-test
        packages: [./healthhttp]
        fuzz: '^FuzzHealthPayload$'
        budget: 5s
        timeout: 20m
      - type: go-test
        packages: [./integration]
        fuzz: '^FuzzOptions$'
        budget: 5s
        timeout: 20m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: [./...]
        benchmark: .
        budget: 100ms
        timeout: 20m
  - module: .
    gate: interoperability
    steps:
      - type: make
        makefile: verification/package.mk
        target: clean-consumer
        timeout: 20m
