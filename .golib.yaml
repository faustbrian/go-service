schema_version: 1
tool_version: v2.5.1
tool_checksums_sha256: ca1293ba633e3ebb5197134cd586979db4e0af51a37e0de0bad2884005327c15

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: .verification

mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json

api:
  baselines:
    - module: .
      mode: apidiff
      path: api/v2-baseline.txt

operations:
  - module: .
    gate: local-test
    steps:
      - type: go-test
        packages: [.]
        run: '^Test(ConcurrentShutdownRunsCleanupOnceAndBoundsEachWaiter|ShutdownCancelsAndJoinsStartup|ShutdownDuringStartupDoesNotStartLaterComponents)$'
        race: true
        count: 1
        timeout: 2m
  - module: .
    gate: docs
    steps:
      - type: make
        makefile: verification/package.mk
        target: docs
        timeout: 20m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzConfig$'
        budget: 5s
        timeout: 20m
      - type: go-test
        packages: [./healthhttp]
        fuzz: '^FuzzHealthPayload$'
        budget: 5s
        timeout: 20m
      - type: go-test
        packages: [./integration]
        fuzz: '^FuzzOptions$'
        budget: 5s
        timeout: 20m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: [./...]
        benchmark: .
        budget: 100ms
        timeout: 20m
  - module: .
    gate: interoperability
    steps:
      - type: make
        makefile: verification/package.mk
        target: candidate-consumer
        timeout: 20m
