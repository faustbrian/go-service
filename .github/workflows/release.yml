name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify signed release
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up minimum Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.25.x
          check-latest: true
          cache: false
      - name: Verify signed tag
        shell: bash
        env:
          RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SIGNING_PUBLIC_KEY"
          printf '%s' "$RELEASE_SIGNING_PUBLIC_KEY" | base64 -d |
            gpg --batch --import
          git verify-tag "$GITHUB_REF_NAME"
      - name: Validate tag, changelog, and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse "${tag}^{commit}")" = "$(git rev-parse HEAD)"
          version="${tag#v}"
          grep -Eq "^## \[${version//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Install pinned linter
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - name: Run complete gate
        run: make check FUZZ_TIME=10s BENCH_TIME=1x

  publish:
    name: Publish reproducible archive
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Build deterministic source archive
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          mkdir -p dist
          git archive --format=tar --prefix="go-service-${tag}/" "$tag" |
            gzip -n > "dist/go-service-${tag}.tar.gz"
          sha256sum "dist/go-service-${tag}.tar.gz" > \
            "dist/go-service-${tag}.checksums.txt"
      - name: Attest archive provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: dist/*
      - name: Extract release notes
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\] - " { found = 1; capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
