name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: Run the stable release rehearsal
        required: false
        default: false
        type: boolean
      durability_composition:
        description: Run the pinned PostgreSQL and Valkey reference composition
        required: false
        default: false
        type: boolean

      platform_containers:
        description: Run the native amd64 and arm64 constrained container checks
        required: false
        default: false
        type: boolean
      constrained_load:
        description: Run the native amd64 and arm64 constrained load campaigns
        required: false
        default: false
        type: boolean
      durability_recovery:
        description: Run process-death and dependency-replacement recovery
        required: false
        default: false
        type: boolean
      durability_version_matrix:
        description: Run the pinned PostgreSQL 14-18 and Valkey version matrix
        required: false
        default: false
        type: boolean
      durability_version_skew:
        description: Run released Queue stopped-owner upgrade, rollback and mixed-version recovery
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  security-events: write

jobs:
  ci:
    uses: faustbrian/go-library-tools/.github/workflows/library-ci.yml@09b43f49385650c44dd4151a12b0877ca6b48a88 # v2.5.1
    with:
      tooling_sha: 09b43f49385650c44dd4151a12b0877ca6b48a88
      source_bootstrap: false
      source_documentation: check
      public_dependencies: true
      release_dry_run: ${{ inputs.release_dry_run || false }}

  durability_composition:
    name: Reference durability composition
    if: github.event_name == 'workflow_dispatch' && inputs.durability_composition
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Prove transaction, replay, rollback and queue lifecycle
        timeout-minutes: 20
        run: ./integration/reference-durability/check-durability.sh

  platform_containers:
    name: Native constrained containers (${{ matrix.architecture }})
    if: github.event_name == 'workflow_dispatch' && inputs.platform_containers
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      GOENV: 'off'
      GOWORK: 'off'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
      GOPRIVATE: ''
      GONOPROXY: ''
      GONOSUMDB: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Native constrained containers
        id: scenario
        timeout-minutes: 20
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          case "$EXPECTED_ARCHITECTURE:$(uname -m)" in
            amd64:x86_64 | arm64:aarch64) ;;
            *) printf 'native runner architecture does not match qualification target\n' >&2; exit 1 ;;
          esac
          ./integration/reference-platform/check-platform.sh "$EXPECTED_ARCHITECTURE"
      - name: Summarize scenario execution
        if: always()
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUNNER_ARCHITECTURE: ${{ runner.arch }}
          SCENARIO_RESULT: ${{ steps.scenario.outcome }}
        run: |
          printf '### Native constrained containers\n\nSource: %s\n\nRunner architecture: %s\n\nScenario outcome: %s\n' \
            "$SOURCE_SHA" "$RUNNER_ARCHITECTURE" "$SCENARIO_RESULT" >> "$GITHUB_STEP_SUMMARY"

  constrained_load:
    name: Native constrained load (${{ matrix.architecture }})
    if: github.event_name == 'workflow_dispatch' && inputs.constrained_load
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      GOENV: 'off'
      GOWORK: 'off'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
      GOPRIVATE: ''
      GONOPROXY: ''
      GONOSUMDB: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Native constrained load
        id: scenario
        timeout-minutes: 20
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          case "$EXPECTED_ARCHITECTURE:$(uname -m)" in
            amd64:x86_64 | arm64:aarch64) ;;
            *) printf 'native runner architecture does not match qualification target\n' >&2; exit 1 ;;
          esac
          ./integration/reference-platform/check-load.sh
      - name: Summarize scenario execution
        if: always()
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUNNER_ARCHITECTURE: ${{ runner.arch }}
          SCENARIO_RESULT: ${{ steps.scenario.outcome }}
        run: |
          printf '### Native constrained load\n\nSource: %s\n\nRunner architecture: %s\n\nScenario outcome: %s\n' \
            "$SOURCE_SHA" "$RUNNER_ARCHITECTURE" "$SCENARIO_RESULT" >> "$GITHUB_STEP_SUMMARY"

  durability_recovery:
    name: Process and dependency recovery
    if: github.event_name == 'workflow_dispatch' && inputs.durability_recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GOENV: 'off'
      GOWORK: 'off'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
      GOPRIVATE: ''
      GONOPROXY: ''
      GONOSUMDB: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Process and dependency recovery
        id: scenario
        timeout-minutes: 25
        run: ./integration/reference-durability/check-recovery.sh
      - name: Summarize scenario execution
        if: always()
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUNNER_ARCHITECTURE: ${{ runner.arch }}
          SCENARIO_RESULT: ${{ steps.scenario.outcome }}
        run: |
          printf '### Process and dependency recovery\n\nSource: %s\n\nRunner architecture: %s\n\nScenario outcome: %s\n' \
            "$SOURCE_SHA" "$RUNNER_ARCHITECTURE" "$SCENARIO_RESULT" >> "$GITHUB_STEP_SUMMARY"

  durability_version_matrix:
    name: PostgreSQL version matrix
    if: github.event_name == 'workflow_dispatch' && inputs.durability_version_matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      GOENV: 'off'
      GOWORK: 'off'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
      GOPRIVATE: ''
      GONOPROXY: ''
      GONOSUMDB: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: PostgreSQL version matrix
        id: scenario
        timeout-minutes: 35
        run: ./integration/reference-durability/check-version-matrix.sh
      - name: Summarize scenario execution
        if: always()
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUNNER_ARCHITECTURE: ${{ runner.arch }}
          SCENARIO_RESULT: ${{ steps.scenario.outcome }}
        run: |
          printf '### PostgreSQL version matrix\n\nSource: %s\n\nRunner architecture: %s\n\nScenario outcome: %s\n' \
            "$SOURCE_SHA" "$RUNNER_ARCHITECTURE" "$SCENARIO_RESULT" >> "$GITHUB_STEP_SUMMARY"

  durability_version_skew:
    name: Released Queue version skew
    if: github.event_name == 'workflow_dispatch' && inputs.durability_version_skew
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GOENV: 'off'
      GOWORK: 'off'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
      GOPRIVATE: ''
      GONOPROXY: ''
      GONOSUMDB: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Released Queue version skew
        id: scenario
        timeout-minutes: 25
        run: ./integration/reference-durability/check-version-skew.sh
      - name: Summarize scenario execution
        if: always()
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUNNER_ARCHITECTURE: ${{ runner.arch }}
          SCENARIO_RESULT: ${{ steps.scenario.outcome }}
        run: |
          printf '### Released Queue version skew\n\nSource: %s\n\nRunner architecture: %s\n\nScenario outcome: %s\n' \
            "$SOURCE_SHA" "$RUNNER_ARCHITECTURE" "$SCENARIO_RESULT" >> "$GITHUB_STEP_SUMMARY"

  required:
    name: Required
    if: always()
    needs: [ci, durability_composition, platform_containers, constrained_load, durability_recovery, durability_version_matrix, durability_version_skew]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require shared workflow and selected qualification
        env:
          CI_RESULT: ${{ needs.ci.result }}
          DURABILITY_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.durability_composition || false }}
          DURABILITY_RESULT: ${{ needs.durability_composition.result }}
          PLATFORM_CONTAINERS_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.platform_containers || false }}
          PLATFORM_CONTAINERS_RESULT: ${{ needs.platform_containers.result }}
          CONSTRAINED_LOAD_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.constrained_load || false }}
          CONSTRAINED_LOAD_RESULT: ${{ needs.constrained_load.result }}
          DURABILITY_RECOVERY_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.durability_recovery || false }}
          DURABILITY_RECOVERY_RESULT: ${{ needs.durability_recovery.result }}
          DURABILITY_VERSION_MATRIX_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.durability_version_matrix || false }}
          DURABILITY_VERSION_MATRIX_RESULT: ${{ needs.durability_version_matrix.result }}
          DURABILITY_VERSION_SKEW_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.durability_version_skew || false }}
          DURABILITY_VERSION_SKEW_RESULT: ${{ needs.durability_version_skew.result }}
        run: |
          test "${CI_RESULT}" = success
          require_optional() {
            case "$1:$2" in
              true:success | false:skipped) ;;
              *) printf 'qualification request/result mismatch: %s:%s\n' "$1" "$2" >&2; return 1 ;;
            esac
          }
          require_optional "$DURABILITY_REQUESTED" "$DURABILITY_RESULT"
          require_optional "$PLATFORM_CONTAINERS_REQUESTED" "$PLATFORM_CONTAINERS_RESULT"
          require_optional "$CONSTRAINED_LOAD_REQUESTED" "$CONSTRAINED_LOAD_RESULT"
          require_optional "$DURABILITY_RECOVERY_REQUESTED" "$DURABILITY_RECOVERY_RESULT"
          require_optional "$DURABILITY_VERSION_MATRIX_REQUESTED" "$DURABILITY_VERSION_MATRIX_RESULT"
          require_optional "$DURABILITY_VERSION_SKEW_REQUESTED" "$DURABILITY_VERSION_SKEW_RESULT"
